name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nexus-tsl .
      - name: Smoke test (port jak na Render)
        run: |
          docker run -d --name ntsl -e PORT=10000 -p 10000:10000 nexus-tsl
          for i in $(seq 1 20); do curl -fs localhost:10000/health && break; sleep 1; done
          curl -fs localhost:10000/health
          curl -fs localhost:10000/ | grep -q NexusTSL
