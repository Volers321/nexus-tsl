name: Ewaluacja AI (intake)

# Uruchamiana ręcznie: Actions -> "Ewaluacja AI (intake)" -> Run workflow.
# Wymaga sekretu repozytorium ANTHROPIC_API_KEY (Settings -> Secrets and variables -> Actions).
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model Claude"
        default: "claude-sonnet-5-5"

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      NEXUS_LLM_MODEL: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[llm]"
      - name: Porównanie strategii
        run: |
          {
            echo "# Wyniki ewaluacji intake (model: $NEXUS_LLM_MODEL)"
            for data in orders orders_holdout; do
              echo; echo "## Zestaw: $data"
              python evals/run_intake_eval.py --data evals/$data.jsonl
              python evals/run_intake_eval.py --data evals/$data.jsonl --provider anthropic
              python evals/run_intake_eval.py --data evals/$data.jsonl --provider anthropic --mode llm-first
              python evals/run_intake_eval.py --data evals/$data.jsonl --provider anthropic --mode llm-only --show-errors
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
