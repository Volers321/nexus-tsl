[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-tsl"
version = "0.2.0"
description = "Zintegrowana platforma AI dla transportu, spedycji i logistyki (TSL)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "lxml>=5"]

[project.scripts]
nexus-demo = "nexus_tsl.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nexus_tsl = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 135
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B905"]
